services:
  app:
    build:
      context: .
      dockerfile: Dockerfile
    restart: unless-stopped
    env_file:
      - .env
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_started
    networks:
      - dokploy-network
    labels:
      - traefik.enable=true
      - traefik.docker.network=dokploy-network
      - "traefik.http.routers.itdbctf-fe.rule=Host(`itdbctf.duckdns.org`)"
      - traefik.http.routers.itdbctf-fe.entrypoints=websecure
      - traefik.http.routers.itdbctf-fe.tls.certResolver=letsencrypt
      - traefik.http.routers.itdbctf-fe.priority=1
      - traefik.http.routers.itdbctf-fe.service=itdbctf-fe
      - traefik.http.services.itdbctf-fe.loadbalancer.server.port=3000
      - "traefik.http.routers.itdbctf-be.rule=Host(`itdbctf.duckdns.org`) && (PathPrefix(`/_event`) || PathPrefix(`/_upload`) || PathPrefix(`/ping`) || PathPrefix(`/_health`) || PathPrefix(`/_all_routes`) || PathPrefix(`/auth`) || PathPrefix(`/api`))"
      - traefik.http.routers.itdbctf-be.entrypoints=websecure
      - traefik.http.routers.itdbctf-be.tls.certResolver=letsencrypt
      - traefik.http.routers.itdbctf-be.priority=100
      - traefik.http.routers.itdbctf-be.service=itdbctf-be
      - traefik.http.services.itdbctf-be.loadbalancer.server.port=8000
    volumes:
      - archivos_retos:/app/FILES_ITDB_CTF/retos

  redis:
    image: redis:7-alpine
    restart: unless-stopped
    command: redis-server --save "" --appendonly no
    networks:
      - dokploy-network

  postgres:
    image: postgres:16
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB}
    volumes:
      - pgdata:/var/lib/postgresql/data
    networks:
      - dokploy-network
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER} -d ${POSTGRES_DB}"]

volumes:
  archivos_retos:
  pgdata:

networks:
  dokploy-network:
    external: true