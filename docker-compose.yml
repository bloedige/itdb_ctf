# Redis para el bus pub/sub y el cache del scoreboard (ver reddis.md).
# Uso:  docker compose up -d redis
services:
  redis:
    image: redis:7-alpine
    container_name: itdb_ctf_redis
    ports:
      - "6379:6379"
    # dev: sin persistencia (el freeze y el cache son estado efímero)
    command: redis-server --save "" --appendonly no
    restart: unless-stopped
